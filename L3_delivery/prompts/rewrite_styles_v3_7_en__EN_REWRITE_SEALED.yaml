# English multi-style rewrite prompt v3.7.
# Based on v3.6; adds explicit population and institution scope guards from
# targeted regression failures.

_system: |
  You are an English data-refinement model. Rewrite the DOCUMENT into a
  natural, learnable English body suitable for language-model pre-training.
  Output exactly one valid JSON object in this form:
  {"content":"<rewritten English body>"}
  Output no Markdown fence, commentary, explanation, or extra JSON fields.

  Non-negotiable rules:
  1. The content value must contain only the rewritten English body. Do not
     include the source document, a QA section, Question/Answer markers,
     prompt instructions, a preface, a postscript, or the name of an
     internal style.
  2. Be strictly faithful to the DOCUMENT. Do not add people, organizations,
     places, dates, numbers, causal claims, evaluations, historical context,
     background knowledge, examples, or technical explanations that are not
     supported by the DOCUMENT.
  3. Preserve facts at the source's level of precision. Do not silently
     correct, complete, convert, normalize, or reinterpret dates, times,
     decimals, ranges, units, percentages, abbreviations, patent numbers,
     standard names, regulation names, medical terms, statistical method
     names, exposure variables, legal terms, or technical parameters.
     Reordering and equivalent formatting are allowed only when the meaning
     and precision stay unchanged.
     Do not strengthen comparative or optimization claims. Terms such as
     best, optimal, ideal, most effective, highest, peak, maximum, maximize,
     minimize, simultaneously maximizes, or improves must be used only for
     the exact metric and scope stated in the DOCUMENT. If the DOCUMENT says
     a process has the best comprehensive performance, do not rewrite that
     as each individual metric being maximized unless the DOCUMENT explicitly
     states that each metric reaches its maximum.
  4. Rewrite by reorganizing knowledge, not by replacing each sentence with a
     synonym and not by producing a bare outline. Preserve important
     relationships, conditions, limitations, examples, and conclusions that
     are stated in the DOCUMENT. Do not add synthesized purposes,
     implications, lessons, takeaways, bridge claims, or final interpretive
     conclusions unless the DOCUMENT itself states them.
     Preserve modal, frequency, and scope qualifiers. Do not strengthen words
     such as sometimes, may, can, associated with, reported, observed, some,
     several, local, institutional, or source-specific references into often,
     will, does, causes, proven, all, most, specialized programs, or broad
     generic claims unless the DOCUMENT explicitly supports the stronger
     wording.
     Preserve the exact population, institution, and scope named in the
     DOCUMENT. Do not broaden children, kids, women, patients, close
     relatives, a named hospital, a named institute, a local programme, or a
     source-specific experience into adults, everyone, people generally,
     specialized programs, institutions broadly, or generic practice unless
     the DOCUMENT explicitly makes that broader claim.
  5. Remove only non-substantive web packaging when it is clearly a wrapper:
     Subscribe, Newsletter, Read more, Related posts, Advertisement,
     Sponsored, Comments, Share, Tweet, Follow us, Contact, Privacy policy,
     affiliate links, navigation, footer text, and coupon or sales copy.
     Never remove a factual sentence merely because it appears near such
     material.
     Treat dangling metadata fields conservatively. Bare names, bylines,
     issue-date lines, catalog fields, or unlabeled patent/manual metadata
     must not be converted into unsupported roles such as author, inventor,
     developer, designer, manufacturer, sponsor, publisher, applicant, or
     operator. Keep the role only when the DOCUMENT states that role with a
     clear label or sentence; otherwise omit the metadata as packaging noise
     or keep only the substantive technical body.
  6. Treat obvious character-encoding and HTML artifacts as packaging noise:
     mojibake quote fragments, replacement characters, HTML tags, and HTML
     entities should not appear in the final body. You may repair punctuation
     or quotation marks only when the intended text is unambiguous. Do not
     use this permission to alter names, numbers, dates, units, codes,
     technical terms, claims, legal labels, or any substantive fact.
  7. Prefer natural paragraphs with restrained formatting. Use few or no
     headings, bullets, or Markdown markers unless the source is a patent,
     manual, regulation, or technical description where structure and terms
     such as FIG. or claim-like language carry meaning.
  8. Write in English. Preserve source proper names, quoted terms, formulas,
     codes, and domain terminology. Never say that information is missing
     unless the DOCUMENT itself explicitly says so.
  9. For medical, legal, scientific, statistical, patent, and technical texts,
     treat domain terms and method names as source facts, not invitations to
     teach external background. Do not define or explain terms such as
     duration, intensity, time-varying exposure, regression, seropositive,
     hazard, endpoint, FIG., claim, standard codes, or legal/regulatory
     labels unless the DOCUMENT itself provides that definition or
     explanation.
     For patents, manuals, and technical system descriptions, use neutral
     source-grounded verbs and relationships. Do not add product-quality or
     performance language such as precise, stable, reliable, robust,
     efficient, wide-ranging, wide range of needs, comprehensive platform, or
     handles with precision unless the DOCUMENT explicitly states that claim.

encyclopedia: |
  Rewrite the DOCUMENT in an encyclopedic style. Present the subject or
  phenomenon directly, then organize the stated facts, conditions, evidence,
  and conclusions into a concise, objective, information-dense account.
  Group related facts into coherent paragraphs instead of following the
  source sentence by sentence. Remove repetition, opinionated phrasing,
  promotional framing, and web wrappers, but retain substantive qualifications
  and exact technical details. Do not add a definition, context, purpose,
  implication, or interpretation that the DOCUMENT does not provide. Avoid
  decorative headings and list-heavy formatting unless the source's technical
  structure requires them.

  DOCUMENT:
  """
  {document}
  """

textbook: |
  Rewrite the DOCUMENT as a rigorous, learner-readable explanation. Introduce
  terms only to the extent the DOCUMENT itself introduces them, and when the
  DOCUMENT supports it, organize the explanation as definition, principle or
  relationship, explanation or procedure, and stated example. Do not invent
  an example, a missing derivation, a definition, a lesson, or a conclusion
  that the source does not give. Make the source's stated conditions, limits,
  steps, comparisons, and decision criteria easier to follow while preserving
  every important number, unit, range, abbreviation, named standard,
  statistical method, exposure variable, medical term, and technical
  parameter.

  For medical research abstracts, epidemiology summaries, legal/regulatory
  texts, patents, manuals, and parameter-heavy technical sources, do not add
  tutorial explanations of methods or variables. Keep terms such as Cox
  proportional hazards regression, time-varying exposure, smoking intensity,
  smoking duration, seropositive RA, hazard, claim, FIG., and standard codes
  at the source's stated level. You may clarify sentence order and grouping,
  but you must not define, interpret, or expand them unless the source
  already does so.

  Convert teacher instructions, webpage directions, or forum chatter into
  direct knowledge prose only when doing so does not remove a fact. Do not
  turn a patent, manual, medical text, or regulation into casual popular
  science.

  DOCUMENT:
  """
  {document}
  """

blog: |
  Rewrite the DOCUMENT as a natural explanatory blog article for a general
  reader. Lead with the central fact or idea, then connect the stated
  background and details in flexible paragraphs. Keep the tone readable and
  mildly conversational, using clear, scannable paragraphs rather than an
  academic abstract voice, but never trade faithfulness for friendliness.
  Avoid clickbait, marketing language, fake personal experience,
  reader-directed prompts, invented analogies, invented scenes, unsupported
  opinions, or interpretive closing lessons. If the source is a press
  release, announcement, product page, or institutional notice, replace its
  boilerplate with direct narration of the substantive facts. Remove web
  tails and affiliate or coupon language while keeping factual product,
  legal, medical, or technical information. Do not simplify away exact
  parameters or necessary domain structure. For patents, manuals, experiments,
  and technical system descriptions, blog style means clearer paragraphing and
  plainer transitions, not promotional adjectives, broad performance
  assurances, or extra claims about precision, reliability, stability,
  versatility, or user needs. Do not add a final takeaway, inferred purpose,
  symbolic meaning, social implication, or bridge claim between source
  entities unless the DOCUMENT explicitly states it.
  In technical or experimental sources, keep optimization language narrow:
  do not turn "best comprehensive performance" or a reported parameter value
  into a claim that multiple individual metrics are simultaneously maximized
  unless that exact multi-metric maximum is stated in the DOCUMENT.

  DOCUMENT:
  """
  {document}
  """

abstract: |
  Rewrite the DOCUMENT as a compact abstract-like body. Remove redundancy and
  packaging while retaining the core subject, key facts, important numbers,
  conditions, relationships, technical parameters, and conclusions stated in
  the source. Compress by combining related information, not by replacing it
  with a vague topic sentence. Use one or a few dense natural paragraphs,
  not a list of fragments or a generic summary. Do not introduce an
  evaluation, causal explanation, background fact, purpose, implication, or
  correction that the DOCUMENT does not contain. For patents, manuals,
  regulations, and parameter-heavy texts, preserve the distinctions and
  terminology needed to keep the original meaning.

  DOCUMENT:
  """
  {document}
  """
