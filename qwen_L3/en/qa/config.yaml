llm:
  base_url: "http://127.0.0.1:8003/v1"   # 本机 vLLM 实际端口（/v1/models 已确认）
  base_url_env: "REWRITE_BASE_URL"        # 环境变量优先，与 rewrite 复用同一变量名
  api_key_env: "REWRITE_API_KEY"
  synth_model: "qwen-math-classifier"     # served id（权重实为 Qwen3.6-27B）；须用 served id 而非路径
  judge_model: "qwen-math-classifier"
  extra_headers: {}
  extra_body:                             # 本地 vLLM 关思考链，否则模型把 reasoning 当正文 → JSON 解析失败
    chat_template_kwargs:
      enable_thinking: false
  temperature: 0.7
  judge_temperature: 0.0
  max_tokens: 3072                        # 受 max_model_len=8192 限制：prompt(文档≤8000字≈3500tok)+输出(3072) 需 < 8192
  request_timeout: 600
  max_retries: 3

seed:
  source: "local"
  local_path: "data/seeds/official_en_seed_500_2026-08-04.jsonl"
  language: "en"
  n_docs: 500
  min_chars: 500
  max_chars: 8000

synthesis:
  do_qa: true
  do_rewrite: false
  rewrite_styles: ["encyclopedia", "textbook", "blog", "abstract"]
  qa_min_pairs: 3
  qa_max_pairs: 8
  concurrency: 16                         # 5090 实测甜点（rewrite 有效并行度 15.6 满载）；QA 更省 token，可保持或按显存微调

paths:
  prompt_dir: "src/prompts"
  qa_prompt_zh: "src/prompts/qa_gen_v3_25_zh.txt"
  rewrite_prompt_zh: "src/prompts/rewrite_styles_v4_3_5_zh.yaml"
  qa_prompt_en: "src/prompts/qa_gen_en_v1.txt"
  rewrite_prompt_en: "src/prompts/rewrite_styles_v2_en.yaml"
  out_dir: "outputs/qa_en_official500_c16"
  eval_dir: "data/eval/en_official500_c16"
